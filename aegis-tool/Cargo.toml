[package]
name = "aegis-tool"
version = "0.4.6"
authors.workspace = true
edition.workspace = true
publish.workspace = true
description = "Aegis SSH client and managed host agent."
license.workspace = true
readme = "README.md"
repository.workspace = true
keywords = ["cli", "ssh", "oauth", "certificate", "remote-access"]

[[bin]]
name = "aegis"
path = "src/main.rs"

[dependencies]
aegis-dto = { workspace = true }

capulus = { workspace = true, features = ["managed-system"] }
phylax-core = { workspace = true }
anyhow = { workspace = true }
time = "0.3"
uuid = { workspace = true }
axum = "0.8"
base64 = { workspace = true }
x25519-dalek = { version = "2", features = ["static_secrets", "getrandom"] }
clap = { workspace = true }
crossterm = { version = "0.29", default-features = false, features = ["events"] }
dialoguer = "0.12"
futures-util = "0.3"
libc = "0.2"
oauth2 = { workspace = true, features = ["reqwest-blocking", "rustls-tls"] }
qrcode = { version = "0.14", default-features = false }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "query", "rustls"] }
rustix = { version = "1", features = ["process", "system"] }
hickory-resolver = { version = "0.26", default-features = false, features = ["tokio"] }
semver = "1"
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.11"
ssh-key = { version = "0.6", features = ["ed25519", "rand_core", "std"] }
tempfile = "3"
tokio = { version = "1", features = ["macros", "net", "process", "rt-multi-thread", "time", "signal"] }
toml = "1"
url = { workspace = true }
webbrowser = "1"

[target.'cfg(target_os = "linux")'.dependencies]
rtnetlink = "0.23"

[target.'cfg(target_os = "macos")'.dependencies]
boringtun = { version = "0.7", features = ["device"] }
tun-rs = { version = "2", features = ["async_tokio"] }
socket2 = { version = "0.6", features = ["all"] }

[build-dependencies]
cc = "1"

[dev-dependencies]
vt100 = "0.16"
