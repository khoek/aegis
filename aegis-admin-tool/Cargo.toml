[package]
name = "aegis-admin-tool"
version = "0.4.6"
authors.workspace = true
edition.workspace = true
publish.workspace = true
description = "Deploy and administer an Aegis installation with local GCP credentials."
license.workspace = true
readme = "README.md"
repository.workspace = true
keywords = ["cli", "ssh", "gcp", "deployment"]

[[bin]]
name = "aegis-admin"
path = "src/main.rs"

[dependencies]
aegis-dto = { workspace = true }
aegis-tool = { workspace = true }

arche-firestore = { workspace = true }
capulus = { workspace = true }
phylax-core = { workspace = true }
phylax-gcp = { workspace = true }
anyhow = { workspace = true }
base64 = { workspace = true }
clap = { workspace = true }
dialoguer = "0.12"
firestore = "0.53"
ipnet = "2"
rcgen = { version = "0.14", features = ["x509-parser"] }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls"] }
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs"] }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.11"
ssh-key = { version = "0.6", features = ["ed25519", "rand_core", "std"] }
tempfile = "3"
time = "0.3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
uuid = { workspace = true }
url = { workspace = true }
x509-parser = "0.18"
