name: check
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - run: rustup update stable --no-self-update
      - run: rustup component add rustfmt clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - uses: google-github-actions/setup-gcloud@v3
        with:
          install_components: cloud-firestore-emulator
      - name: Firestore and setup recovery
        env:
          FIRESTORE_EMULATOR_HOST: 127.0.0.1:8791
        run: |
          gcloud emulators firestore start --host-port="$FIRESTORE_EMULATOR_HOST" --quiet > /tmp/firestore.log 2>&1 &
          emulator_pid=$!
          trap 'kill "$emulator_pid"; wait "$emulator_pid" || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --silent --max-time 1 "http://$FIRESTORE_EMULATOR_HOST/" >/dev/null; then break; fi
            sleep 1
          done
          cargo test -p aegis-tool --locked emulator -- --ignored
          cargo test -p aegis-tool --locked --test setup -- --include-ignored
          cargo test -p aegis-api --locked namespace_subtrees -- --ignored
      - run: docker build --file aegis-api/Dockerfile --tag aegis-api:check .
