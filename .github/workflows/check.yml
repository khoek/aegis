name: check
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - run: rustup update stable --no-self-update
      - run: rustup component add rustfmt clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo clippy -p aegis-tool --all-targets --locked -- -D warnings
      - run: cargo test -p aegis-tool --locked
      - name: Check long-running fleet installs
        run: cargo test -p aegis-tool --locked remote_install_waits_for_slow_builds -- --ignored
      - name: Check client dependency boundary
        run: |
          python3 - <<'PY'
          import subprocess
          tree = subprocess.check_output([
              "cargo", "tree", "-p", "aegis-tool",
              "--edges", "normal", "--prefix", "none", "--locked",
          ], text=True, timeout=60)
          packages = {line.split()[0] for line in tree.splitlines()}
          forbidden = {"arche-firestore", "firestore", "gcloud-sdk", "phylax-gcp", "phylax-oidc", "rcgen", "x509-parser"}
          assert not packages & forbidden, f"Administration dependencies in client: {packages & forbidden}"
          PY
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "27"
      - uses: google-github-actions/setup-gcloud@v3
        with:
          install_components: cloud-firestore-emulator
      - name: Firestore and setup recovery
        env:
          FIRESTORE_EMULATOR_HOST: 127.0.0.1:8791
        run: |
          gcloud emulators firestore start --host-port="$FIRESTORE_EMULATOR_HOST" --quiet > /tmp/firestore.log 2>&1 &
          emulator_pid=$!
          trap 'status=$?; if [ "$status" -ne 0 ]; then cat /tmp/firestore.log; fi; kill "$emulator_pid" 2>/dev/null || true; wait "$emulator_pid" || true' EXIT
          ready=false
          for attempt in $(seq 1 60); do
            kill -0 "$emulator_pid" || exit 1
            if curl --silent --max-time 1 "http://$FIRESTORE_EMULATOR_HOST/" >/dev/null; then ready=true; break; fi
            sleep 1
          done
          "$ready"
          cargo test -p aegis-admin-tool --locked emulator -- --ignored
          cargo test -p aegis-admin-tool --locked --test setup -- --include-ignored
          cargo test -p aegis-api --locked -- --ignored
      - run: docker build --file aegis-api/Dockerfile --tag aegis-api:check .
